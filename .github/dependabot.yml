# Avisos y PRs automaticos por dependencias con vulnerabilidades o nuevas
# versiones (Reglas §8.4). Solo se aceptan versiones estables.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # El salto de major de Angular (p. ej. 21 -> 22) se hace a proposito y
    # coordinado con `ng update`, nunca por PRs sueltos. Se siguen recibiendo
    # parches y minors dentro de la version actual.
    ignore:
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
