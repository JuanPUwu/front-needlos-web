# Avisos y PRs automaticos por dependencias con vulnerabilidades o nuevas
# versiones (Reglas §8.4). Solo se aceptan versiones estables.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
