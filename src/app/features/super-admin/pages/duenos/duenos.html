<main class="sdue">
  <app-encabezado
    titulo="Dueños"
    subtitulo="Quiénes administran cada sastrería y cómo contactarlos."
    icono="usuario"
    [error]="error()"
  />

  <section class="sdue-bloque" aria-labelledby="t-duenos">
    <app-titulo-bloque titulo="Listado" idTitulo="t-duenos">
      <span class="sdue-cuenta">
        @if (enEsqueleto()) {
          <app-esqueleto forma="numero" texto="Cargando..." />
        } @else {
          {{ total() }}
        }
      </span>
    </app-titulo-bloque>

    <div class="sdue-filtros" role="group" aria-label="Filtros">
      <div class="sdue-buscar">
        <input
          #buscador
          class="sdue-control"
          type="search"
          placeholder="Buscar por nombre, correo, teléfono o sastrería"
          aria-label="Buscar dueños"
          [value]="filtros().buscar"
          (input)="alBuscar(buscador.value)"
        />
        <app-boton-recargar [recargando]="cargando()" (recargar)="recargar()" />
      </div>
      <select
        #correoSel
        class="sdue-control"
        aria-label="Correo"
        (change)="alCambiarCorreo(correoSel.value)"
      >
        @for (c of correos; track c.valor) {
          <option [value]="c.valor" [selected]="c.valor === filtros().correo">
            {{ c.etiqueta }}
          </option>
        }
      </select>
      <select
        #ordenSel
        class="sdue-control"
        aria-label="Orden"
        (change)="alCambiarOrden(ordenSel.value)"
      >
        @for (o of ordenes; track o.valor) {
          <option [value]="o.valor" [selected]="o.valor === filtros().orden">
            {{ o.etiqueta }}
          </option>
        }
      </select>
      @if (hayFiltros()) {
        <button class="sdue-limpiar" type="button" (click)="limpiarFiltros()">
          Limpiar filtros
        </button>
      }
    </div>

    @if (enEsqueleto()) {
      <app-esqueleto
        forma="tabla"
        [filas]="6"
        [alto]="58"
        [maximo]="20"
        texto="Cargando dueños..."
      />
    } @else if (duenos().length === 0 && !error()) {
      @if (hayFiltros()) {
        <app-vacio
          icono="carrete"
          titulo="No encontramos dueños"
          mensaje="Ningún dueño coincide con lo elegido."
        />
      } @else {
        <app-vacio icono="usuario" titulo="Aún no hay dueños" />
      }
    } @else if (duenos().length > 0) {
      <app-duenos-tabla [duenos]="duenos()" [cargando]="cargando()" />
      @if (totalPaginas() > 1) {
        <nav class="sdue-paginacion" aria-label="Paginación">
          <button
            class="sdue-pagina"
            type="button"
            [disabled]="pagina() === 0"
            (click)="irAPagina(pagina() - 1)"
          >
            Anterior
          </button>
          <span class="sdue-paginacion__texto">
            Página {{ pagina() + 1 }} de {{ totalPaginas() }}
          </span>
          <button
            class="sdue-pagina"
            type="button"
            [disabled]="pagina() + 1 >= totalPaginas()"
            (click)="irAPagina(pagina() + 1)"
          >
            Siguiente
          </button>
        </nav>
      }
    }
  </section>
</main>
