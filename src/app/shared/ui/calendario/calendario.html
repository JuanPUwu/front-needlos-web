<div class="calendario" [class.calendario--lectura]="soloLectura()">
  <div class="calendario__cabecera">
    <button
      class="calendario__mover"
      type="button"
      aria-label="Mes anterior"
      [disabled]="!puedeRetroceder()"
      (click)="mover(-1)"
    >
      <app-icono class="calendario__flecha calendario__flecha--izq" nombre="flecha-derecha" />
    </button>
    <span class="calendario__titulo" aria-live="polite">{{ titulo() }}</span>
    <button class="calendario__mover" type="button" aria-label="Mes siguiente" (click)="mover(1)">
      <app-icono class="calendario__flecha" nombre="flecha-derecha" />
    </button>
  </div>

  <table class="calendario__tabla" role="grid" [attr.aria-label]="titulo()">
    <thead>
      <tr>
        @for (d of dias; track d) {
          <th scope="col" class="calendario__dia-semana">{{ d }}</th>
        }
      </tr>
    </thead>
    <tbody>
      @for (semana of semanas(); track $index) {
        <tr>
          @for (dia of semana; track dia.iso) {
            <td>
              <button
                class="calendario__dia"
                type="button"
                [class.calendario__dia--fuera]="!dia.delMes"
                [class.calendario__dia--hoy]="dia.esHoy"
                [class.calendario__dia--elegido]="dia.iso === valor()"
                [disabled]="dia.deshabilitado"
                [attr.tabindex]="soloLectura() ? -1 : null"
                [attr.aria-pressed]="dia.iso === valor()"
                [attr.aria-label]="dia.iso"
                (click)="elegir(dia)"
              >
                {{ dia.numero }}
              </button>
            </td>
          }
        </tr>
      }
    </tbody>
  </table>
</div>
