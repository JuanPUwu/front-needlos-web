<button
  class="cmp__boton"
  type="button"
  [class.cmp__boton--activo]="abierta()"
  [class.cmp__boton--avisos]="bandeja.noLeidas() > 0"
  [attr.aria-expanded]="abierta()"
  aria-controls="bandeja"
  [attr.aria-label]="
    bandeja.noLeidas() > 0
      ? 'Notificaciones: ' + bandeja.noLeidas() + ' sin leer'
      : 'Notificaciones'
  "
  title="Notificaciones"
  (click)="alternar()"
>
  <app-icono class="cmp__icono" nombre="campana" />
  @if (bandeja.noLeidas() > 0) {
    <span class="cmp__cuenta" aria-hidden="true">{{
      bandeja.noLeidas() > 99 ? '99+' : bandeja.noLeidas()
    }}</span>
  }
</button>

@if (abierta()) {
  <section
    class="cmp__panel"
    id="bandeja"
    aria-labelledby="t-bandeja"
    animate.enter="cmp--entrar"
    animate.leave="cmp--salir"
  >
    <header class="cmp__cabeza">
      <h2 class="cmp__titulo" id="t-bandeja">Notificaciones</h2>
      <div class="cmp__acciones">
        @if (bandeja.noLeidas() > 0) {
          <button class="cmp__todas" type="button" (click)="bandeja.marcarTodas()">
            Marcar como leídas
          </button>
        }
        @if ((bandeja.lista()?.length ?? 0) > 0) {
          <button class="cmp__todas" type="button" (click)="bandeja.limpiarTodo()">
            Limpiar todo
          </button>
        }
      </div>
    </header>

    @let lista = bandeja.lista();
    @if (lista === null) {
      <!-- Mientras carga: el esqueleto común de los listados (Reglas §12.2). -->
      <app-esqueleto
        forma="lista"
        [filas]="4"
        [alto]="64"
        [maximo]="30"
        texto="Cargando notificaciones..."
      />
    } @else {
      <ul class="cmp__lista">
        @for (n of lista; track n.id) {
          <li class="cmp__fila">
            <button
              class="cmp__item"
              type="button"
              [class.cmp__item--nueva]="!n.leida"
              [class.cmp__item--enlace]="!!n.enlace"
              [attr.data-tono]="n.tono"
              (click)="elegir(n)"
            >
              <span class="cmp__punto" aria-hidden="true"></span>
              <span class="cmp__texto">
                <span class="cmp__item-titulo">{{ n.titulo }}</span>
                <span class="cmp__fecha">{{ n.fecha | fechaHora }}</span>
              </span>
            </button>
            <!-- Quitar de la campana: sigue en el historial. -->
            <button
              class="cmp__quitar"
              type="button"
              aria-label="Quitar de la campana"
              title="Quitar (queda en el historial)"
              (click)="bandeja.archivar(n)"
            >
              <app-icono class="cmp__quitar-icono" nombre="cerrar" />
            </button>
          </li>
        } @empty {
          <li class="cmp__vacio">
            <app-vacio icono="campana" titulo="No tienes notificaciones" [compacto]="true" />
          </li>
        }
      </ul>
    }

    <a class="cmp__historial" routerLink="/notificaciones" (click)="cerrar()">Ver historial</a>
  </section>
}
