<header class="encabezado">
  <!-- Volver: a la izquierda, antes del ícono y el título (dueño 2026-10-20). -->
  @if (volverRuta(); as ruta) {
    <a
      class="encabezado__volver"
      [routerLink]="ruta"
      [attr.aria-label]="'Volver a ' + volverEtiqueta()"
    >
      <span class="encabezado__flecha" aria-hidden="true">←</span>
      <span class="encabezado__volver-texto">{{ volverEtiqueta() }}</span>
    </a>
  }
  @if (icono(); as nombre) {
    <span class="encabezado__icono" aria-hidden="true">
      <app-icono class="encabezado__icono-svg" [nombre]="nombre" />
    </span>
  }

  <div class="encabezado__texto">
    <h1 class="encabezado__titulo" [attr.id]="idTitulo()">{{ titulo() }}</h1>
    @if (subtitulo()) {
      <p class="encabezado__subtitulo">{{ subtitulo() }}</p>
    }
  </div>

  @if (error(); as e) {
    <p class="encabezado__error" role="alert" [title]="e">{{ e }}</p>
  }

  <div class="encabezado__acciones">
    <ng-content />
    <!-- Recargar (dueño 2026-10-20): trae lo último sin perder lo que se ve. -->
    @if (recargable()) {
      <button
        class="encabezado__recargar"
        type="button"
        [class.encabezado__recargar--girando]="recargando()"
        [disabled]="recargando()"
        [attr.aria-label]="recargando() ? 'Recargando…' : 'Recargar'"
        [title]="recargando() ? 'Recargando…' : 'Recargar'"
        (click)="recargar.emit()"
      >
        <app-icono class="encabezado__recargar-icono" nombre="recargar" />
      </button>
    }
    @if (conCampana()) {
      <app-campana class="encabezado__campana" />
    }
  </div>
</header>
