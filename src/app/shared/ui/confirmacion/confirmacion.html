@if (servicio.actual(); as c) {
  <div class="conf" animate.enter="conf--entrar" animate.leave="conf--salir">
    <div class="conf__fondo" aria-hidden="true" (click)="servicio.responder(false)"></div>
    <div
      class="conf__caja"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="conf-titulo"
      aria-describedby="conf-mensaje"
      [attr.data-tipo]="c.tipo"
    >
      <!-- Símbolo según lo que es: advertencia, peligro o información (dueño 2026-10-20). -->
      <span class="conf__simbolo" aria-hidden="true">
        <app-icono class="conf__simbolo-icono" [nombre]="c.tipo" />
      </span>
      <h2 class="conf__titulo" id="conf-titulo">{{ c.titulo }}</h2>
      <p class="conf__mensaje" id="conf-mensaje">{{ c.mensaje }}</p>
      <div class="conf__acciones" [class.conf__acciones--uno]="c.soloAceptar">
        @if (!c.soloAceptar) {
          <button
            #primero
            class="conf__boton conf__boton--secundario"
            type="button"
            (click)="servicio.responder(false)"
          >
            {{ c.cancelar }}
          </button>
          <button
            class="conf__boton"
            type="button"
            [class.conf__boton--peligro]="c.peligro"
            (click)="servicio.responder(true)"
          >
            {{ c.aceptar }}
          </button>
        } @else {
          <button
            #primero
            class="conf__boton"
            type="button"
            [class.conf__boton--peligro]="c.peligro"
            (click)="servicio.responder(true)"
          >
            {{ c.aceptar }}
          </button>
        }
      </div>
    </div>
  </div>
}
